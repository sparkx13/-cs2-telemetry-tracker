from demoparser2 import DemoParser
import pandas as pd
import numpy as np

TRADE_WINDOW_SECONDS = 5.0
TICK_RATE = 64.0  # CS2 subtick servers record demos at 64 ticks/sec

class CS2DemoAnalyzer:
    def __init__(self, demo_path: str):
        self.parser = DemoParser(demo_path)

    def parse_full_map_telemetry(self) -> pd.DataFrame:
        # 1. Extract Kills & Filter Warmup
        kills = self.parser.parse_event(
            "player_death",
            player=["X", "Y", "team_name"],
            other=["total_rounds_played", "is_warmup_period"]
        )
        kills = kills[~kills["is_warmup_period"]].copy()
        kills.sort_values("tick", inplace=True)

        # 2. Extract Damage & Cap Health Damage at 100
        hurts = self.parser.parse_event(
            "player_hurt",
            other=["total_rounds_played", "is_warmup_period"]
        )
        hurts = hurts[~hurts["is_warmup_period"]].copy()
        hurts["dmg_capped"] = hurts["dmg_health"].clip(upper=100)

        rounds = sorted(kills["total_rounds_played"].unique())
        num_rounds = len(rounds)

        # Gather unique players by 64-bit SteamID
        players = pd.concat([
            kills[["attacker_steamid", "attacker_name"]].rename(
                columns={"attacker_steamid": "steamid", "attacker_name": "name"}
            ),
            kills[["user_steamid", "user_name"]].rename(
                columns={"user_steamid": "steamid", "user_name": "name"}
            )
        ]).dropna().drop_duplicates(subset=["steamid"])
        players = players[players["steamid"] != "0"]

        player_ids = players["steamid"].tolist()

        # Initialize trackers
        first_kills = {pid: 0 for pid in player_ids}
        first_deaths = {pid: 0 for pid in player_ids}
        traded_deaths = {pid: 0 for pid in player_ids}
        kast_rounds = {pid: 0 for pid in player_ids}

        # 3. Round-by-Round KAST, Trade, and Opening Duel Engine
        for r in rounds:
            r_kills = kills[kills["total_rounds_played"] == r].sort_values("tick")
            if r_kills.empty:
                continue

            # Opening Duel: First kill event of the round
            opener = r_kills.iloc[0]
            if opener["attacker_steamid"] in first_kills:
                first_kills[opener["attacker_steamid"]] += 1
            if opener["user_steamid"] in first_deaths:
                first_deaths[opener["user_steamid"]] += 1

            # Determine Trade Kills (Killer dies within 5 seconds / 320 ticks)
            traded_victims_this_round = set()
            kill_records = r_kills.to_dict("records")
            for i, d_event in enumerate(kill_records):
                victim = d_event["user_steamid"]
                killer = d_event["attacker_steamid"]
                death_tick = d_event["tick"]

                for j in range(i + 1, len(kill_records)):
                    subsequent = kill_records[j]
                    if (subsequent["tick"] - death_tick) > (TRADE_WINDOW_SECONDS * TICK_RATE):
                        break
                    if subsequent["user_steamid"] == killer:
                        traded_victims_this_round.add(victim)
                        if victim in traded_deaths:
                            traded_deaths[victim] += 1
                        break

            # Evaluate K-A-S-T for every player in round `r`
            r_killers = set(r_kills["attacker_steamid"].dropna())
            r_assisters = set(r_kills["assister_steamid"].dropna())
            r_victims = set(r_kills["user_steamid"].dropna())

            for pid in player_ids:
                got_kill = pid in r_killers
                got_assist = pid in r_assisters
                survived = pid not in r_victims
                was_traded = pid in traded_victims_this_round

                if got_kill or got_assist or survived or was_traded:
                    kast_rounds[pid] += 1

        # 4. Aggregate Totals & Compute HLTV 2.0 Rating
        tot_kills = kills.groupby("attacker_steamid").size()
        tot_deaths = kills.groupby("user_steamid").size()
        tot_assists = kills.groupby("assister_steamid").size()
        tot_dmg = hurts.groupby("attacker_steamid")["dmg_capped"].sum()

        rows = []
        for _, p in players.iterrows():
            pid = p["steamid"]
            k = int(tot_kills.get(pid, 0))
            d = int(tot_deaths.get(pid, 0))
            a = int(tot_assists.get(pid, 0))
            dmg = float(tot_dmg.get(pid, 0.0))

            kpr = k / num_rounds
            dpr = d / num_rounds
            apr = a / num_rounds
            adr = dmg / num_rounds
            kast_pct = (kast_rounds[pid] / num_rounds) * 100.0

            # HLTV 2.0 Formula
            impact = (2.13 * kpr) + (0.42 * apr) - 0.41
            rating_2_0 = (
                (0.0073 * kast_pct)
                + (0.3591 * kpr)
                - (0.5329 * dpr)
                + (0.2372 * impact)
                + (0.0032 * adr)
                + 0.1587
            )

            rows.append({
                "steam_id_64": pid,
                "nickname": p["name"],
                "kills": k,
                "deaths": d,
                "assists": a,
                "first_kills": first_kills[pid],
                "first_deaths": first_deaths[pid],
                "traded_deaths": traded_deaths[pid],
                "adr": round(adr, 2),
                "kast_pct": round(kast_pct, 2),
                "impact": round(impact, 2),
                "rating_2_0": round(rating_2_0, 2)
            })

        return pd.DataFrame(rows).sort_values("rating_2_0", ascending=False)

import os
import glob
import shutil
import tempfile
import zstandard as zstd
import patoolib
import psycopg2
from curl_cffi import requests
from demo_engine import CS2DemoAnalyzer

class DemoIngestionPipeline:
    def __init__(self, db_dsn: str, proxy_url: str = None):
        self.db_dsn = db_dsn
        self.session = requests.Session(impersonate="chrome124")
        if proxy_url:
            self.session.proxies = {"http": proxy_url, "https": proxy_url}

    def download_and_extract_demos(self, demo_url: str, extract_dir: str) -> list[str]:
        """Streams the HLTV demo archive and extracts all .dem files."""
        resp = self.session.get(demo_url, stream=True, allow_redirects=True, timeout=120)
        if resp.status_code != 200:
            raise RuntimeError(f"Demo download failed ({resp.status_code}): {demo_url}")

        final_url = str(resp.url)
        ext = ".rar"
        if ".zst" in final_url:
            ext = ".dem.zst"
        elif ".zip" in final_url:
            ext = ".zip"

        archive_path = os.path.join(extract_dir, f"match_archive{ext}")
        with open(archive_path, "wb") as f:
            for chunk in resp.iter_content(chunk_size=1024 * 1024):
                if chunk:
                    f.write(chunk)

        if ext == ".dem.zst":
            out_dem = os.path.join(extract_dir, "map_1.dem")
            dctx = zstd.ZstdDecompressor()
            with open(archive_path, "rb") as ifh, open(out_dem, "wb") as ofh:
                dctx.copy_stream(ifh, ofh)
        else:
            patoolib.extract_archive(archive_path, outdir=extract_dir, verbosity=-1)

        os.remove(archive_path)
        return sorted(glob.glob(os.path.join(extract_dir, "**", "*.dem"), recursive=True))

    def process_match_demos(self, match_uuid: str, demo_url: str):
        """Full pipeline: Download -> Extract -> Parse ticks -> Upsert to Postgres."""
        work_dir = tempfile.mkdtemp(prefix="cs2_demo_")
        try:
            dem_files = self.download_and_extract_demos(demo_url, work_dir)
            print(f"Extracted {len(dem_files)} .dem files for match {match_uuid}")

            with psycopg2.connect(self.db_dsn) as conn:
                with conn.cursor() as cur:
                    for idx, dem_path in enumerate(dem_files, start=1):
                        analyzer = CS2DemoAnalyzer(dem_path)
                        header = analyzer.parser.parse_header()
                        map_name = header.get("map_name", f"map_{idx}").replace("de_", "")

                        stats_df = analyzer.parse_full_map_telemetry()

                        cur.execute("""
                            INSERT INTO match_maps (match_id, map_number, map_name)
                            VALUES (%s, %s, %s)
                            RETURNING map_id;
                        """, (match_uuid, idx, map_name))
                        map_id = cur.fetchone()[0]

                        for _, row in stats_df.iterrows():
                            steam_id_int = int(row["steam_id_64"])
                            cur.execute("""
                                INSERT INTO players (steam_id_64, nickname)
                                VALUES (%s, %s)
                                ON CONFLICT (steam_id_64) DO UPDATE
                                SET nickname = EXCLUDED.nickname
                                RETURNING player_id;
                            """, (steam_id_int, row["nickname"]))
                            player_uuid = cur.fetchone()[0]

                            cur.execute("""
                                INSERT INTO player_map_stats (
                                    map_id, player_id, kills, deaths, assists,
                                    first_kills, first_deaths, traded_deaths,
                                    adr, kast_pct, impact_rating, rating_2_0
                                ) VALUES (%s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s)
                                ON CONFLICT (map_id, player_id) DO NOTHING;
                            """, (
                                map_id, player_uuid,
                                row["kills"], row["deaths"], row["assists"],
                                row["first_kills"], row["first_deaths"], row["traded_deaths"],
                                row["adr"], row["kast_pct"], row["impact"], row["rating_2_0"]
                            ))

                    cur.execute("""
                        UPDATE matches SET status = 'finished' WHERE match_id = %s;
                    """, (match_uuid,))

        finally:
            shutil.rmtree(work_dir, ignore_errors=True)

services:
  db:
    image: postgres:16-alpine
    container_name: cs2_postgres
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cs2_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cs2_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cs2_fastapi
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8000
      --workers 2

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cs2_celery_worker
    restart: unless-stopped
    env_file: .env
    shm_size: "2gb"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A worker.celery_app worker
      --loglevel=info
      --concurrency=2

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cs2_celery_beat
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A worker.celery_app beat
      --loglevel=info

volumes:
  pgdata:
  redisdata:

