CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

-- 1. Canonical Teams & Entity Resolution
CREATE TABLE teams (
    team_id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
    name VARCHAR(120) NOT NULL,
    hltv_id INTEGER UNIQUE,
    vrs_rank INTEGER,
    vrs_points INTEGER,
    hltv_rank INTEGER,
    updated_at TIMESTAMPTZ DEFAULT NOW()
);

-- 2. Canonical Players (Anchored by 64-bit SteamID)
CREATE TABLE players (
    player_id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
    steam_id_64 BIGINT UNIQUE NOT NULL,
    hltv_id INTEGER UNIQUE,
    nickname VARCHAR(80) NOT NULL,
    current_team_id UUID REFERENCES teams(team_id)
);

-- 3. Matches & Market Mapping
CREATE TABLE matches (
    match_id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
    hltv_match_id INTEGER UNIQUE NOT NULL,
    event_name VARCHAR(255),
    team_a_id UUID REFERENCES teams(team_id),
    team_b_id UUID REFERENCES teams(team_id),
    best_of SMALLINT NOT NULL DEFAULT 3,
    status VARCHAR(20) DEFAULT 'scheduled', -- scheduled, live, finished
    scheduled_at TIMESTAMPTZ NOT NULL,
    polymarket_condition_id VARCHAR(120)
);

-- 4. Map Veto Sequence (Critical for pre-match prediction models)
CREATE TABLE match_vetoes (
    veto_id SERIAL PRIMARY KEY,
    match_id UUID REFERENCES matches(match_id) ON DELETE CASCADE,
    step_num SMALLINT NOT NULL,
    team_id UUID REFERENCES teams(team_id),
    action VARCHAR(10) NOT NULL, -- 'removed', 'picked', 'left_over'
    map_name VARCHAR(30) NOT NULL
);

-- 5. Individual Maps Played
CREATE TABLE match_maps (
    map_id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
    match_id UUID REFERENCES matches(match_id) ON DELETE CASCADE,
    map_number SMALLINT NOT NULL,
    map_name VARCHAR(30) NOT NULL,
    team_a_score SMALLINT DEFAULT 0,
    team_b_score SMALLINT DEFAULT 0,
    team_a_ct_rounds SMALLINT DEFAULT 0,
    team_a_t_rounds SMALLINT DEFAULT 0
);

-- 6. Granular Player Map Stats (Populated via HLTV or Demo Parser)
CREATE TABLE player_map_stats (
    stat_id SERIAL PRIMARY KEY,
    map_id UUID REFERENCES match_maps(map_id) ON DELETE CASCADE,
    player_id UUID REFERENCES players(player_id),
    team_id UUID REFERENCES teams(team_id),
    kills SMALLINT NOT NULL,
    deaths SMALLINT NOT NULL,
    assists SMALLINT NOT NULL,
    first_kills SMALLINT DEFAULT 0,
    first_deaths SMALLINT DEFAULT 0,
    traded_deaths SMALLINT DEFAULT 0,
    adr NUMERIC(5,2) NOT NULL,
    kast_pct NUMERIC(5,2) NOT NULL,
    impact_rating NUMERIC(4,2) NOT NULL,
    rating_2_0 NUMERIC(4,2) NOT NULL,
    UNIQUE(map_id, player_id)
);

CREATE INDEX idx_player_stats_lookup ON player_map_stats(player_id, map_id);
CREATE INDEX idx_matches_scheduled ON matches(scheduled_at) WHERE status = 'scheduled';

import re
from typing import Dict, List, Optional
from curl_cffi import requests
from bs4 import BeautifulSoup

class CS2Scraper:
    def __init__(self, proxy_url: Optional[str] = None):
        # Impersonate modern Chrome TLS/JA3 fingerprint to bypass Cloudflare
        self.session = requests.Session(impersonate="chrome124")
        if proxy_url:
            self.session.proxies = {"http": proxy_url, "https": proxy_url}
        self.base_url = "https://www.hltv.org"

    def _get_soup(self, path: str) -> BeautifulSoup:
        url = f"{self.base_url}{path}" if path.startswith("/") else path
        resp = self.session.get(url, timeout=15)
        if resp.status_code != 200:
            raise RuntimeError(f"Blocked or failed ({resp.status_code}) on {url}")
        return BeautifulSoup(resp.text, "lxml")

    def get_upcoming_matches(self) -> List[Dict]:
        """Scrapes upcoming match schedule, HLTV match IDs, and team IDs."""
        soup = self._get_soup("/matches")
        matches = []

        for match_el in soup.select(".upcomingMatch"):
            link_el = match_el.select_one("a.match")
            if not link_el:
                continue

            href = link_el.get("href", "")
            match_id_search = re.search(r"/matches/(\d+)/", href)
            if not match_id_search:
                continue

            hltv_match_id = int(match_id_search.group(1))
            unix_ms = match_el.get("data-zonedgrouping-entry-unix")
            team1 = match_el.select_one(".matchTeam.team1 .matchTeamName")
            team2 = match_el.select_one(".matchTeam.team2 .matchTeamName")
            event = match_el.select_one(".matchEventName")
            meta = match_el.select_one(".matchMeta")

            matches.append({
                "hltv_match_id": hltv_match_id,
                "url": f"{self.base_url}{href}",
                "scheduled_unix": int(unix_ms) // 1000 if unix_ms else None,
                "team_a": team1.text.strip() if team1 else "TBD",
                "team_b": team2.text.strip() if team2 else "TBD",
                "event": event.text.strip() if event else "Unknown",
                "best_of": meta.text.strip() if meta else "bo1"
            })

        return matches

    def get_match_details_and_veto(self, match_url: str) -> Dict:
        """Extracts map vetoes, demo download ID, and map stats links."""
        soup = self._get_soup(match_url)
        
        # 1. Parse Map Veto Box
        vetoes = []
        veto_boxes = soup.select(".standard-box.veto-box .padding > div")
        for idx, div in enumerate(veto_boxes, start=1):
            text = div.text.strip()
            vetoes.append({"step": idx, "raw_text": text})

        # 2. Extract Demo Download Link (if match is finished)
        demo_link_el = soup.select_one("a[data-demo-link]")
        demo_path = demo_link_el.get("data-demo-link") if demo_link_el else None

        # 3. Extract Map Scores
        maps_played = []
        for map_holder in soup.select(".mapholder"):
            map_name_el = map_holder.select_one(".mapname")
            scores = map_holder.select(".results-team-score")
            if map_name_el and len(scores) == 2:
                maps_played.append({
                    "map_name": map_name_el.text.strip(),
                    "team_a_score": scores[0].text.strip(),
                    "team_b_score": scores[1].text.strip(),
                })

        return {
            "vetoes": vetoes,
            "demo_url": f"{self.base_url}{demo_path}" if demo_path else None,
            "maps": maps_played
        }

import re
import requests
import psycopg2
from typing import List, Dict

GITHUB_API_URL = (
    "https://api.github.com/repos/ValveSoftware/"
    "counter-strike_regional_standings/contents/live/2026"
)

class VRSSyncWorker:
    def __init__(self, db_dsn: str):
        self.db_dsn = db_dsn
        self.session = requests.Session()
        self.session.headers.update({
            "Accept": "application/vnd.github.v3+json",
            "User-Agent": "CS2-Data-Tracker-VRS-Sync"
        })

    def get_latest_global_markdown_url(self) -> str:
        """Finds the newest standings_global_YYYY_MM_DD.md file in Valve's repo."""
        resp = self.session.get(GITHUB_API_URL, timeout=15)
        resp.raise_for_status()
        files = resp.json()

        global_files = [
            f for f in files
            if f["name"].startswith("standings_global_") and f["name"].endswith(".md")
        ]
        if not global_files:
            raise RuntimeError("No global VRS standings files found in repository.")

        latest_file = sorted(global_files, key=lambda x: x["name"])[-1]
        return latest_file["download_url"]

    def parse_vrs_markdown(self, md_text: str) -> List[Dict]:
        """
        Parses Valve's Markdown table format:
        | Standing | Points | Team Name | Roster | ...
        """
        standings = []
        row_pattern = re.compile(
            r"^\|\s*(\d+)\s*\|\s*(\d+)\s*\|\s*([^|]+?)\s*\|\s*([^|]+?)\s*\|"
        )

        for line in md_text.splitlines():
            match = row_pattern.match(line.strip())
            if match:
                rank = int(match.group(1))
                points = int(match.group(2))
                team_name = match.group(3).strip()
                roster_str = match.group(4).strip()
                roster = [p.strip() for p in roster_str.split(",") if p.strip()]

                standings.append({
                    "vrs_rank": rank,
                    "vrs_points": points,
                    "team_name": team_name,
                    "roster": roster
                })
        return standings

    def sync_to_postgres(self) -> int:
        raw_url = self.get_latest_global_markdown_url()
        md_resp = self.session.get(raw_url, timeout=15)
        md_resp.raise_for_status()

        parsed_rows = self.parse_vrs_markdown(md_resp.text)
        if not parsed_rows:
            return 0

        with psycopg2.connect(self.db_dsn) as conn:
            with conn.cursor() as cur:
                cur.execute("""
                    ALTER TABLE teams 
                    ADD COLUMN IF NOT EXISTS vrs_points INTEGER;
                """)

                for row in parsed_rows:
                    cur.execute("""
                        UPDATE teams
                        SET vrs_rank = %s,
                            vrs_points = %s,
                            updated_at = NOW()
                        WHERE LOWER(name) = LOWER(%s);
                    """, (row["vrs_rank"], row["vrs_points"], row["team_name"]))

                    if cur.rowcount == 0:
                        cur.execute("""
                            INSERT INTO teams (name, vrs_rank, vrs_points)
                            VALUES (%s, %s, %s)
                            ON CONFLICT DO NOTHING;
                        """, (row["team_name"], row["vrs_rank"], row["vrs_points"]))

        return len(parsed_rows)

import os
import psycopg2
from psycopg2.extras import RealDictCursor
from celery import Celery
from celery.schedules import crontab

from scraper import CS2Scraper
from vrs_sync import VRSSyncWorker
from demo_pipeline import DemoIngestionPipeline
from polymarket_matcher import PolymarketCS2Matcher

REDIS_URL = os.getenv("REDIS_URL", "redis://localhost:6379/0")
DATABASE_URL = os.getenv("DATABASE_URL", "dbname=cs2_tracker user=postgres password=postgres host=localhost")
PROXY_URL = os.getenv("SCRAPER_PROXY_URL") or None

celery_app = Celery("cs2_tasks", broker=REDIS_URL, backend=REDIS_URL)

celery_app.conf.update(
    timezone="UTC",
    enable_utc=True,
    task_serializer="json",
    result_serializer="json",
    accept_content=["json"],
    worker_prefetch_multiplier=1,
)

celery_app.conf.beat_schedule = {
    "sync-vrs-rankings-every-6h": {
        "task": "worker.task_sync_vrs",
        "schedule": crontab(minute=0, hour="*/6"),
    },
    "sync-upcoming-matches-every-15m": {
        "task": "worker.task_sync_upcoming_matches",
        "schedule": crontab(minute="*/15"),
    },
    "ingest-finished-match-demos-every-20m": {
        "task": "worker.task_process_pending_demos",
        "schedule": crontab(minute="*/20"),
    },
}


@celery_app.task(name="worker.task_sync_vrs")
def task_sync_vrs():
    syncer = VRSSyncWorker(DATABASE_URL)
    updated_count = syncer.sync_to_postgres()
    return {"status": "ok", "vrs_teams_synced": updated_count}


@celery_app.task(name="worker.task_sync_upcoming_matches")
def task_sync_upcoming_matches():
    scraper = CS2Scraper(proxy_url=PROXY_URL)
    upcoming = scraper.get_upcoming_matches()

    inserted = 0
    with psycopg2.connect(DATABASE_URL, cursor_factory=RealDictCursor) as conn:
        with conn.cursor() as cur:
            for m in upcoming:
                if m["team_a"] == "TBD" or m["team_b"] == "TBD" or not m["scheduled_unix"]:
                    continue

                team_uuids = []
                for t_name in (m["team_a"], m["team_b"]):
                    cur.execute("SELECT team_id FROM teams WHERE LOWER(name) = LOWER(%s);", (t_name,))
                    row = cur.fetchone()
                    if row:
                        team_uuids.append(row["team_id"])
                    else:
                        cur.execute(
                            "INSERT INTO teams (name) VALUES (%s) RETURNING team_id;",
                            (t_name,)
                        )
                        team_uuids.append(cur.fetchone()["team_id"])

                bo_num = int("".join(filter(str.isdigit, m["best_of"])) or 1)

                cur.execute("""
                    INSERT INTO matches (
                        hltv_match_id, event_name, team_a_id, team_b_id,
                        best_of, status, scheduled_at
                    ) VALUES (
                        %s, %s, %s, %s, %s, 'scheduled', to_timestamp(%s)
                    )
                    ON CONFLICT (hltv_match_id) DO UPDATE
                    SET scheduled_at = EXCLUDED.scheduled_at,
                        team_a_id = EXCLUDED.team_a_id,
                        team_b_id = EXCLUDED.team_b_id;
                """, (
                    m["hltv_match_id"], m["event"],
                    team_uuids[0], team_uuids[1],
                    bo_num, m["scheduled_unix"]
                ))
                inserted += 1

    matcher = PolymarketCS2Matcher(DATABASE_URL)
    matcher.sync_and_scan_edges(model_predictions={})
    return {"status": "ok", "matches_upserted": inserted}


@celery_app.task(name="worker.task_process_pending_demos")
def task_process_pending_demos():
    scraper = CS2Scraper(proxy_url=PROXY_URL)
    pipeline = DemoIngestionPipeline(DATABASE_URL, proxy_url=PROXY_URL)
    processed = 0

    with psycopg2.connect(DATABASE_URL, cursor_factory=RealDictCursor) as conn:
        with conn.cursor() as cur:
            cur.execute("""
                SELECT match_id, hltv_match_id
                FROM matches
                WHERE status != 'finished'
                  AND scheduled_at < NOW() - INTERVAL '90 minutes'
                ORDER BY scheduled_at DESC
                LIMIT 5;
            """)
            candidates = cur.fetchall()

    for match in candidates:
        match_url = f"https://www.hltv.org/matches/{match['hltv_match_id']}/-"
        try:
            details = scraper.get_match_details_and_veto(match_url)
            if details.get("demo_url"):
                pipeline.process_match_demos(str(match["match_id"]), details["demo_url"])
                processed += 1
        except Exception as exc:
            print(f"Skipping match {match['hltv_match_id']} demo check: {exc}")

    return {"status": "ok", "demos_processed": processed}
