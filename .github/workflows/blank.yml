import os
import json
from fastapi import FastAPI, HTTPException
import redis
import psycopg2
from psycopg2.extras import RealDictCursor
from scraper import CS2Scraper
from polymarket_matcher import PolymarketCS2Matcher
from worker import task_sync_vrs, task_sync_upcoming_matches

DATABASE_URL = os.getenv("DATABASE_URL", "dbname=cs2_tracker user=postgres password=postgres host=db")
REDIS_URL = os.getenv("REDIS_URL", "redis://redis:6379/0")
PROXY_URL = os.getenv("SCRAPER_PROXY_URL") or None

app = FastAPI(title="Custom CS2 Telemetry & Analytics API", version="1.0.0")
cache = redis.from_url(REDIS_URL, decode_responses=True)
scraper = CS2Scraper(proxy_url=PROXY_URL)
matcher = PolymarketCS2Matcher(DATABASE_URL)

def get_db_conn():
    return psycopg2.connect(DATABASE_URL, cursor_factory=RealDictCursor)

@app.get("/v1/matches/upcoming")
def fetch_upcoming_matches():
    """Returns upcoming CS2 matches, cached for 5 minutes."""
    cached = cache.get("matches:upcoming")
    if cached:
        return json.loads(cached)

    matches = scraper.get_upcoming_matches()
    cache.setex("matches:upcoming", 300, json.dumps(matches))
    return matches

@app.get("/v1/players/{steam_id}/rolling-form")
def get_player_rolling_form(steam_id: int, maps_limit: int = 20):
    """Computes a player's rolling metrics across their last N maps for ML features."""
    cache_key = f"player:form:{steam_id}:{maps_limit}"
    cached = cache.get(cache_key)
    if cached:
        return json.loads(cached)

    query = """
        SELECT 
            p.nickname,
            COUNT(s.map_id) AS maps_sampled,
            ROUND(AVG(s.rating_2_0), 3) AS avg_rating,
            ROUND(AVG(s.adr), 2) AS avg_adr,
            ROUND(AVG(s.kast_pct), 2) AS avg_kast,
            ROUND(SUM(s.first_kills)::numeric / NULLIF(SUM(s.first_kills + s.first_deaths), 0), 3) AS opening_duel_win_rate
        FROM (
            SELECT ps.*
            FROM player_map_stats ps
            JOIN players pl ON pl.player_id = ps.player_id
            JOIN match_maps mm ON mm.map_id = ps.map_id
            JOIN matches m ON m.match_id = mm.match_id
            WHERE pl.steam_id_64 = %s
            ORDER BY m.scheduled_at DESC
            LIMIT %s
        ) s
        JOIN players p ON p.player_id = s.player_id
        GROUP BY p.nickname;
    """
    with get_db_conn() as conn:
        with conn.cursor() as cur:
            cur.execute(query, (steam_id, maps_limit))
            result = cur.fetchone()

    if not result:
        raise HTTPException(status_code=404, detail="Player telemetry not found")

    payload = dict(result)
    cache.setex(cache_key, 1800, json.dumps(payload, default=float))
    return payload

@app.post("/v1/polymarket/scan-ev")
def scan_polymarket_ev(model_probs: dict[int, float]):
    """
    Accepts a JSON payload of {hltv_match_id: model_prob_team_a}
    Example: {"2376543": 0.64, "2376548": 0.41}
    """
    return matcher.sync_and_scan_edges(model_probs)

@app.post("/v1/tasks/trigger-initial-sync")
def trigger_initial_sync():
    """Manually dispatches VRS + Upcoming Match sync jobs to Celery immediately."""
    vrs_job = task_sync_vrs.delay()
    matches_job = task_sync_upcoming_matches.delay()
    return {
        "message": "Background sync dispatched",
        "vrs_task_id": vrs_job.id,
        "matches_task_id": matches_job.id
    }

import json
import requests
import psycopg2
from psycopg2.extras import RealDictCursor
from rapidfuzz import fuzz
from typing import Dict, List, Optional, Tuple

GAMMA_BASE_URL = "https://gamma-api.polymarket.com"

TEAM_ALIASES = {
    "natus vincere": "navi",
    "faze clan": "faze",
    "g2 esports": "g2",
    "team vitality": "vitality",
    "team spirit": "spirit",
    "team liquid": "liquid",
    "mouz": "mousesports",
    "virtus.pro": "vp",
    "eternal fire": "ef",
    "the mongolz": "mongolz",
}

def normalize_team_name(name: str) -> str:
    clean = name.lower().strip()
    for prefix in ("team ", "esports", " clan", " gaming", " club"):
        clean = clean.replace(prefix, "").strip()
    return TEAM_ALIASES.get(name.lower().strip(), clean)


class PolymarketCS2Matcher:
    def __init__(self, db_dsn: str):
        self.db_dsn = db_dsn
        self.session = requests.Session()

    def fetch_active_cs2_markets(self) -> List[Dict]:
        """Queries Polymarket Gamma API for open Counter-Strike / CS2 markets."""
        markets_found = []
        for query_term in ("CS2", "Counter-Strike"):
            resp = self.session.get(
                f"{GAMMA_BASE_URL}/public-search",
                params={"q": query_term},
                timeout=15
            )
            if resp.status_code != 200:
                continue

            data = resp.json()
            events = data.get("events", [])
            for event in events:
                if event.get("closed") or not event.get("active"):
                    continue
                for mkt in event.get("markets", []):
                    if mkt.get("closed") or not mkt.get("active"):
                        continue

                    outcomes = json.loads(mkt.get("outcomes", "[]"))
                    prices = [float(p) for p in json.loads(mkt.get("outcomePrices", "[]"))]
                    clob_tokens = json.loads(mkt.get("clobTokenIds", "[]"))

                    if len(outcomes) == 2 and len(prices) == 2:
                        markets_found.append({
                            "event_title": event.get("title", ""),
                            "question": mkt.get("question", ""),
                            "condition_id": mkt.get("conditionId"),
                            "outcomes": outcomes,
                            "prices": prices,
                            "clob_token_ids": clob_tokens,
                            "liquidity": float(mkt.get("liquidityNum", 0.0)),
                            "end_date": mkt.get("endDate")
                        })
        return markets_found

    def match_hltv_to_polymarket(
        self, hltv_team_a: str, hltv_team_b: str, poly_markets: List[Dict]
    ) -> Optional[Tuple[Dict, bool]]:
        norm_a = normalize_team_name(hltv_team_a)
        norm_b = normalize_team_name(hltv_team_b)

        for mkt in poly_markets:
            out_0 = normalize_team_name(mkt["outcomes"][0])
            out_1 = normalize_team_name(mkt["outcomes"][1])

            score_direct = min(
                fuzz.token_set_ratio(norm_a, out_0),
                fuzz.token_set_ratio(norm_b, out_1)
            )
            if score_direct >= 82:
                return mkt, False

            score_inverted = min(
                fuzz.token_set_ratio(norm_a, out_1),
                fuzz.token_set_ratio(norm_b, out_0)
            )
            if score_inverted >= 82:
                return mkt, True

        return None

    @staticmethod
    def evaluate_ev_and_kelly(
        model_prob_a: float,
        poly_price_a: float,
        poly_price_b: float,
        kelly_fraction: float = 0.25
    ) -> Dict:
        model_prob_b = 1.0 - model_prob_a

        edge_a = model_prob_a - poly_price_a
        ev_pct_a = (edge_a / poly_price_a) * 100.0 if poly_price_a > 0 else 0.0
        kelly_a = (
            kelly_fraction * (edge_a / (1.0 - poly_price_a))
            if edge_a > 0 and poly_price_a < 1.0 else 0.0
        )

        edge_b = model_prob_b - poly_price_b
        ev_pct_b = (edge_b / poly_price_b) * 100.0 if poly_price_b > 0 else 0.0
        kelly_b = (
            kelly_fraction * (edge_b / (1.0 - poly_price_b))
            if edge_b > 0 and poly_price_b < 1.0 else 0.0
        )

        if edge_a >= edge_b and edge_a > 0:
            return {
                "recommended_side": "Team A",
                "model_prob": round(model_prob_a, 4),
                "market_implied_prob": round(poly_price_a, 4),
                "raw_edge_pct": round(edge_a * 100, 2),
                "ev_roi_pct": round(ev_pct_a, 2),
                "quarter_kelly_bankroll_pct": round(kelly_a * 100, 2)
            }
        elif edge_b > 0:
            return {
                "recommended_side": "Team B",
                "model_prob": round(model_prob_b, 4),
                "market_implied_prob": round(poly_price_b, 4),
                "raw_edge_pct": round(edge_b * 100, 2),
                "ev_roi_pct": round(ev_pct_b, 2),
                "quarter_kelly_bankroll_pct": round(kelly_b * 100, 2)
            }
        return {"recommended_side": "NO BET (Negative EV on both sides)"}

    def sync_and_scan_edges(self, model_predictions: Dict[int, float]) -> List[Dict]:
        poly_markets = self.fetch_active_cs2_markets()
        opportunities = []

        with psycopg2.connect(self.db_dsn, cursor_factory=RealDictCursor) as conn:
            with conn.cursor() as cur:
                cur.execute("""
                    SELECT m.match_id, m.hltv_match_id,
                           ta.name AS team_a_name, tb.name AS team_b_name
                    FROM matches m
                    JOIN teams ta ON ta.team_id = m.team_a_id
                    JOIN teams tb ON tb.team_id = m.team_b_id
                    WHERE m.status = 'scheduled';
                """)
                upcoming_db = cur.fetchall()

                for row in upcoming_db:
                    matched = self.match_hltv_to_polymarket(
                        row["team_a_name"], row["team_b_name"], poly_markets
                    )
                    if not matched:
                        continue

                    mkt, is_inverted = matched
                    price_a = mkt["prices"][1] if is_inverted else mkt["prices"][0]
                    price_b = mkt["prices"][0] if is_inverted else mkt["prices"][1]

                    cur.execute("""
                        UPDATE matches
                        SET polymarket_condition_id = %s
                        WHERE match_id = %s;
                    """, (mkt["condition_id"], row["match_id"]))

                    hltv_id = row["hltv_match_id"]
                    if hltv_id in model_predictions:
                        ev_analysis = self.evaluate_ev_and_kelly(
                            model_prob_a=model_predictions[hltv_id],
                            poly_price_a=price_a,
                            poly_price_b=price_b
                        )
                        opportunities.append({
                            "hltv_match_id": hltv_id,
                            "matchup": f"{row['team_a_name']} vs {row['team_b_name']}",
                            "condition_id": mkt["condition_id"],
                            "liquidity_usd": mkt["liquidity"],
                            **ev_analysis
                        })

        return opportunities

# CS2 Telemetry, VRS & Polymarket +EV Engine

A self-hosted Counter-Strike 2 esports data pipeline and analytics API inspired by Cito. Combines Cloudflare-bypassing match scrapers, tick-accurate `.dem` replay parsing (`demoparser2`), official Valve Regional Standings (VRS) synchronization, and Polymarket Gamma API +EV edge detection.

## Architecture

* **PostgreSQL 16**: Canonical entity resolution across HLTV IDs, 64-bit SteamIDs, Valve VRS standings, map vetoes, and Polymarket `conditionId`s.
* **FastAPI + Redis**: High-speed cached REST endpoints (`/v1/matches/upcoming`, `/v1/players/{steam_id}/rolling-form`, `/v1/polymarket/scan-ev`).
* **Celery + Celery Beat**: Automated background workers that sync Valve's GitHub VRS standings (every 6h), upcoming matches & Polymarket odds (every 15m), and `.dem` replay archives (every 20m).

## Quick Start

1. **Copy the environment template:**
   ```bash
   cp .env.example .env
   ```

2. **Build and launch the stack:**
   ```bash
